version: '3'
services:
  mongodb:
    image: mongo:latest
    volumes:
      - mongodb_data:/data/db
    restart: always

  flexyssh:
    build: .
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/flexyssh
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=your_secure_password
      - SESSION_SECRET=your_random_session_secret
      - NODE_ENV=production
      - BEHIND_PROXY=true
    ports:
      - "3000:3000"
    volumes:
      - flexyssh_keys:/usr/src/app/keys
    depends_on:
      - mongodb
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mongodb_data:
  flexyssh_keys: 